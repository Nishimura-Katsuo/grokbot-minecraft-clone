<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VoxelCraft</title><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
canvas{display:block}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#hotbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:rgba(0,0,0,.45);border-radius:8px;backdrop-filter:blur(4px)}
.slot{width:48px;height:48px;border:2px solid rgba(255,255,255,.25);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative}
.slot.sel{border-color:#fff;box-shadow:0 0 10px #fff8}
.slot img{width:36px;height:36px;image-rendering:pixelated}
.slot span{position:absolute;top:1px;left:4px;color:#fff;font-size:11px;text-shadow:1px 1px #000}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,10,30,.35);color:#fff;text-align:center;cursor:pointer}
#overlay h1{font-size:56px;margin:0;letter-spacing:4px;text-shadow:0 4px 18px #000}
#overlay p{opacity:.9;text-shadow:0 2px 6px #000}
#info{position:fixed;top:8px;left:10px;color:#fff;font:12px monospace;text-shadow:1px 1px #000}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head><body>
<div id="cross"></div><div id="hotbar"></div><div id="info"></div>
<div id="overlay"><h1>VOXELCRAFT</h1><p>Click to play<br><br>WASD move · Space jump/swim · Shift sprint · Mouse look<br>Left click break · Right click place · 1-9 / wheel select block · T fast-forward time · Q quality</p></div>
<script type="module" src="./main.js"></script>
</body></html>
